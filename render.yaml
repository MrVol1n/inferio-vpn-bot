services:
  - type: web
    name: inferio-vpn-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SERVICE_ROLE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: inferio-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: TERMS_TEXT
        sync: false
      - key: PRIVACY_TEXT
        sync: false
      - key: PLATEGA_MERCHANT_ID
        sync: false
      - key: PLATEGA_SECRET
        sync: false
      - key: PLATEGA_RETURN_URL
        sync: false
      - key: PLATEGA_CALLBACK_URL
        sync: false
      - key: REMNAWAVE_BASE_URL
        sync: false
      - key: REMNAWAVE_TOKEN
        sync: false
      - key: TRIAL_SQUAD_UUIDS
        sync: false
      - key: GRACE_SQUAD_UUID
        sync: false
  - type: worker
    name: inferio-vpn-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.main
    autoDeploy: true
    envVars:
      - key: SERVICE_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: inferio-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: TERMS_TEXT
        sync: false
      - key: PRIVACY_TEXT
        sync: false
      - key: PLATEGA_MERCHANT_ID
        sync: false
      - key: PLATEGA_SECRET
        sync: false
      - key: REMNAWAVE_BASE_URL
        sync: false
      - key: REMNAWAVE_TOKEN
        sync: false
      - key: TRIAL_SQUAD_UUIDS
        sync: false
      - key: GRACE_SQUAD_UUID
        sync: false
      - key: REMINDER_DAYS
        value: 7,3,1,0

databases:
  - name: inferio-db
    region: frankfurt
    plan: basic-256mb
